name: Irate-Box app bundle (mermaid)

# Builds the Mermaid live editor's hub build (pnpm build:hub: offline, served at /mermaid/) for the Irate-Box hub and uploads it as a run artifact,
# irate-box-mermaid-<commit>, which the hub's librarian can install (through nightly.link, or with
# a GitHub token). No releases: this is a fork for testing. The hub code lives on the hub branch, so that is what is built.
# The bundle carries irate-box-bundle.json: which repository and commit it was built from.
# Artifacts expire after 90 days, so this also runs monthly.

on:
  push:
    branches: [develop]
  schedule:
    - cron: '23 5 1 * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        default: hub

permissions:
  contents: read

concurrency:
  group: irate-box-bundle
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || 'hub' }}
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (hub mode)
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm build:hub
      - name: Third-party notices
        # THIRD-PARTY-NOTICES.txt in the bundle: what npm does not describe first, then every
        # package installed under node_modules with its license text -- a superset of what the
        # bundle contains, since bundlers also take from devDependencies.
        run: |
          out="docs/THIRD-PARTY-NOTICES.txt"
          {
            cat <<NOTICE
          Mermaid Live Editor (MIT License), hub build, built for the Irate-Box hub from ${{ github.repository }} at ${{ github.sha }}.
          Source: https://github.com/${{ github.repository }}/tree/${{ github.sha }}

          NOTICE
            cat <<'NOTICE'
          Includes mermaid (MIT) and its ELK layout: elkjs is under the Eclipse Public License 2.0,
          source at https://github.com/kieler/elkjs (the version is in the list below).
          Includes Font Awesome Free, vendored under vendor/fontawesome: icons CC BY 4.0, fonts
          SIL OFL 1.1, code MIT -- https://fontawesome.com/license/free (its LICENSE.txt below).

          NOTICE
            node .github/scripts/irate-box-notices.mjs node_modules
          } > "$out"
          du -h "$out"
      - name: Record what was built
        run: |
          cat > "docs/irate-box-bundle.json" <<JSON
          {"app": "mermaid", "repository": "${{ github.repository }}", "ref": "$(git rev-parse --abbrev-ref HEAD)",
           "commit": "$(git rev-parse HEAD)", "built": "$(date -u +%Y-%m-%dT%H:%M:%SZ)", "run": ${{ github.run_id }}}
          JSON
          echo "SHORT=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          du -sh "docs"

      - uses: actions/upload-artifact@v7
        with:
          name: irate-box-mermaid-${{ env.SHORT }}
          path: docs
          retention-days: 90
          compression-level: 6
          if-no-files-found: error
